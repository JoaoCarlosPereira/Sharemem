# Cada grupo = memórias que afirmam a MESMA coisa. Use `ids` (preferível, fixa o
# gabarito) e/ou `query` (+ `project`, `top` = quantos hits viram membros).
# Depois da 1ª rodada, confira `members` na saída e troque as queries pelos ids.
