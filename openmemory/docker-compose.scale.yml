# Scale deployment stack — Mem0/OpenMemory (ADR-006).
#
# Usage:
#   ./scripts/bootstrap-scale.sh
#   docker compose -f docker-compose.scale.yml up -d
#
# Connect via the reverse proxy (default port 8765). API workers and write
# workers are decoupled; metadata/queue live in PostgreSQL via PgBouncer.
#
# This is the SINGLE supported deployment mode of the project. The UI (incl. the
# /admin panel) is part of the default stack (port 3000). Use ``python install.py``.

x-api-common: &api-common
  image: mem0/openmemory-mcp
  build:
    context: ..
    dockerfile: openmemory/api/Dockerfile
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &api-env
    USER: ${USER:-openmemory}
    API_KEY: ${API_KEY:-}
    MEM0_LOCAL_ONLY: ${MEM0_LOCAL_ONLY:-1}
    MEM0_TELEMETRY: ${MEM0_TELEMETRY:-false}
    # Fail-closed: block API/MCP memory deletes unless explicitly enabled.
    MEM0_ALLOW_MEMORY_DELETE: ${MEM0_ALLOW_MEMORY_DELETE:-0}
    MEM0_ALLOW_BULK_DELETE: ${MEM0_ALLOW_BULK_DELETE:-0}
    # Familias de projeto (PR #19): repositorios irmaos contam como um assunto
    # so no boost de ranqueamento e no strict_project. Leitura segue GLOBAL.
    MEM0_PROJECT_GROUPS: ${MEM0_PROJECT_GROUPS:-sysmo-s1=sysmovs,sysmos1-modular,db-sysmo-s1}
    # Dedup semantica apos a escrita (PR #19). 'report' apenas registra em log
    # o que superseria, sem alterar dado; passar para 'apply' so apos calibrar.
    # Relatorio consultavel: GET /admin/autodedup/report (tabela autodedup_reports);
    # ver docs/runbooks/autodedup-calibration.md.
    MEM0_AUTODEDUP_MODE: ${MEM0_AUTODEDUP_MODE:-report}
    QDRANT_HOST: mem0_store
    QDRANT_PORT: "6333"
    DATABASE_URL: postgresql://${POSTGRES_USER:-mem0}:${POSTGRES_PASSWORD:-mem0}@pgbouncer:5432/${POSTGRES_DB:-openmemory}
    DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
    DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
    DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-30}
    DATABASE_POOL_RECYCLE: ${DATABASE_POOL_RECYCLE:-1800}
    REDIS_URL: redis://redis:6379/0
    # Inferência via Ollama EXTERNO (host/rede), o padrão deste stack. Default
    # host.docker.internal cobre um Ollama no próprio host; para um Ollama em
    # outra máquina da LAN, defina estas URLs no .env com o IP/porta dele.
    # Para subir Ollama em container, use o profile `local-inference` (compose/
    # inference.yml) e aponte estas URLs para ollama-llm / ollama-embed.
    LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
    LLM_MODEL: ${LLM_MODEL:-}
    LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
    LLM_API_KEY: ${LLM_API_KEY:-}
    OLLAMA_LLM_URL: ${OLLAMA_LLM_URL:-http://host.docker.internal:11434}
    EMBEDDER_PROVIDER: ${EMBEDDER_PROVIDER:-ollama}
    EMBEDDER_MODEL: ${EMBEDDER_MODEL:-}
    EMBEDDER_BASE_URL: ${EMBEDDER_BASE_URL:-http://host.docker.internal:11434}
    OLLAMA_EMBED_URL: ${OLLAMA_EMBED_URL:-http://host.docker.internal:11434}
    OPENMEMORY_DISCOVERY_BASE_URL: ${OPENMEMORY_DISCOVERY_BASE_URL:-}
    RUN_EMBEDDED_WORKER: "false"
    WRITE_WORKER_MAX_CONCURRENCY: ${WRITE_WORKER_MAX_CONCURRENCY:-1}
    # ETA for MCP ack: measured ~45s/job with serial LLM; do not divide by worker
    # concurrency until llama.cpp --parallel (or equivalent) is raised.
    WRITE_WORKER_EMA_JOB_SEC: ${WRITE_WORKER_EMA_JOB_SEC:-45}
    WRITE_WORKER_ETA_CONCURRENCY: ${WRITE_WORKER_ETA_CONCURRENCY:-1}
    WRITE_QUEUE_STALL_WATCHDOG_INTERVAL_SEC: ${WRITE_QUEUE_STALL_WATCHDOG_INTERVAL_SEC:-60}
    WRITE_WORKER_HEARTBEAT_STALE_SEC: ${WRITE_WORKER_HEARTBEAT_STALE_SEC:-90}
    # Limites do caminho de leitura MCP: uma busca lenta não deve prender a
    # sessão até o timeout do cliente; valores podem ser ajustados sem rebuild.
    MEM0_SEARCH_EMBED_TIMEOUT_SEC: ${MEM0_SEARCH_EMBED_TIMEOUT_SEC:-12}
    MEM0_SEARCH_VECTOR_TIMEOUT_SEC: ${MEM0_SEARCH_VECTOR_TIMEOUT_SEC:-8}
    MEM0_SEARCH_SCROLL_TIMEOUT_SEC: ${MEM0_SEARCH_SCROLL_TIMEOUT_SEC:-8}
    # Autenticação por equipe (task_11 / ADR-006): warn (default) -> enforce.
    AUTH_MODE: ${AUTH_MODE:-warn}
    # Token dedicado para mutações destrutivas /admin/* (restore, purge, requeue-done).
    # Também aceito: sessão JWT com email em AUTH_ADMIN_EMAILS.
    ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    AUTH_ADMIN_EMAILS: ${AUTH_ADMIN_EMAILS:-}
    # CORS explícito (vírgula). Default na API: localhost:3000 + NEXTAUTH_URL.
    CORS_ORIGINS: ${CORS_ORIGINS:-}
    NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    OPENMEMORY_UI_URL: ${OPENMEMORY_UI_URL:-}
    # Caminho do secret de tokens (ex.: Docker secret montado em /run/secrets).
    AUTH_TOKENS_FILE: ${AUTH_TOKENS_FILE:-/run/secrets/team_tokens}
    # Auth Google + identidade (feature auth Google, ADR-002/ADR-006/ADR-007).
    # AUTH_JWT_SECRET assina o JWT de sessão da UI (>= 32 bytes; defina no .env
    # ou monte como secret). AUTH_ALLOWED_DOMAIN restringe o login ao domínio
    # Google Workspace da empresa. GOOGLE_CLIENT_ID valida o `aud` do ID token;
    # GOOGLE_CLIENT_SECRET é exigido pelo polling do Device Flow (ADR-007).
    # Sem AUTH_JWT_SECRET/AUTH_ALLOWED_DOMAIN o login Google fica desabilitado
    # (fail-closed) e o fluxo legado por hostname segue intacto.
    AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-${NEXTAUTH_SECRET:-}}
    AUTH_ALLOWED_DOMAIN: ${AUTH_ALLOWED_DOMAIN:-}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    # Client OAuth separado p/ device flow (tipo "TVs"; ADR-009) — opcional,
    # fallback para GOOGLE_CLIENT_ID/SECRET quando ausente.
    GOOGLE_DEVICE_CLIENT_ID: ${GOOGLE_DEVICE_CLIENT_ID:-}
    GOOGLE_DEVICE_CLIENT_SECRET: ${GOOGLE_DEVICE_CLIENT_SECRET:-}
    # Tracing OTLP (task_08 / ADR-004).
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-}
    # Loja interna (AgentRegistry) — hostname interno do Compose, sem Traefik.
    AGENT_REGISTRY_BASE_URL: ${AGENT_REGISTRY_BASE_URL:-http://agentregistry:8080}
    AGENT_REGISTRY_INTERNAL_URL: ${AGENT_REGISTRY_INTERNAL_URL:-http://agentregistry:8080}
    # Kanban PLANKA sidecar (schema Postgres `planka`; sem Qdrant).
    PLANKA_BASE_URL: ${PLANKA_INTERNAL_URL:-${PLANKA_BASE_URL:-http://planka:1337}}
    PLANKA_INTERNAL_URL: ${PLANKA_INTERNAL_URL:-http://planka:1337}
    PLANKA_PUBLIC_URL: ${PLANKA_PUBLIC_URL:-/planka}
    PLANKA_MIRROR_SYNC: ${PLANKA_MIRROR_SYNC:-1}
    # JWT do embed dura mais que a sessão UI (8 dias por padrão).
    PLANKA_EMBED_TOKEN_TTL_SECONDS: ${PLANKA_EMBED_TOKEN_TTL_SECONDS:-691200}
    PLANKA_INTERNAL_ACCESS_TOKEN: ${PLANKA_INTERNAL_ACCESS_TOKEN:-${INTERNAL_ACCESS_TOKEN:-}}
    NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
    # Anexos de cards Spec (volume dedicado — nunca Qdrant / mem0_storage).
    SPEC_ATTACHMENTS_DIR: ${SPEC_ATTACHMENTS_DIR:-/mnt/spec-attachments}
    # Anexos PLANKA (/app/data no sidecar) montados no mcp/worker para backup.
    PLANKA_ATTACHMENTS_DIR: ${PLANKA_ATTACHMENTS_DIR:-/mnt/planka-attachments}
    # Object store para backup/cold tier (task_02/07 / ADR-003).
    S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    S3_BUCKET: ${S3_BUCKET:-mem0-backups}
    # Sem default fraco: defina S3_ACCESS_KEY / S3_SECRET_KEY no .env (obrigatório).
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    # Caminho no host montado em /mnt/backups (traduzido pela API para a UI).
    LOCAL_BACKUP_DIR: ${LOCAL_BACKUP_DIR:-./backups}
  env_file:
    - api/.env
  depends_on:
    mem0_store:
      condition: service_started
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy

include:
  - compose/postgres.yml
  - compose/redis.yml
  - compose/inference.yml
  - compose/proxy.yml
  - compose/observability.yml
  - compose/backup.yml

services:
  mem0_store:
    container_name: mem0_store
    image: qdrant/qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ${QDRANT_STORAGE:-mem0_storage}:/qdrant/storage

  openmemory-mcp:
    <<: *api-common
    container_name: openmemory_api
    labels:
      - traefik.enable=true
      # MCP (consultas de memória): sem circuit breaker — leitura é crítica.
      - traefik.http.routers.openmemory-mcp.rule=PathPrefix(`/mcp`)
      - traefik.http.routers.openmemory-mcp.entrypoints=web
      - traefik.http.routers.openmemory-mcp.service=openmemory
      - traefik.http.routers.openmemory-mcp.priority=100
      - traefik.http.middlewares.openmemory-mcp-ratelimit.ratelimit.average=500
      - traefik.http.middlewares.openmemory-mcp-ratelimit.ratelimit.burst=200
      - traefik.http.routers.openmemory-mcp.middlewares=openmemory-mcp-ratelimit
      # Demais rotas: rate limit + circuit breaker para proteger escrita/admin.
      - traefik.http.routers.openmemory.rule=PathPrefix(`/`) && !PathPrefix(`/mcp`)
      - traefik.http.routers.openmemory.entrypoints=web
      - traefik.http.routers.openmemory.priority=1
      - traefik.http.services.openmemory.loadbalancer.server.port=8765
      - traefik.http.services.openmemory.loadbalancer.sticky.cookie=true
      - traefik.http.services.openmemory.loadbalancer.sticky.cookie.name=mem0_sse_affinity
      - traefik.http.middlewares.openmemory-ratelimit.ratelimit.average=100
      - traefik.http.middlewares.openmemory-ratelimit.ratelimit.burst=50
      - traefik.http.middlewares.openmemory-cb.circuitbreaker.expression=ResponseCodeRatio(500, 600, 0, 600) > 0.50
      - traefik.http.routers.openmemory.middlewares=openmemory-ratelimit,openmemory-cb
    depends_on:
      mem0_store:
        condition: service_started
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      traefik:
        condition: service_started
    # Diretório local de backup (.zip), montado para restore/list/status e backup
    # manual via /admin/backup/* (task_06 / ADR-003). Alinhado ao local_dir padrão
    # da BackupPolicy (/mnt/backups). Defina LOCAL_BACKUP_DIR no .env para apontar
    # a um caminho da LAN. NÃO substitui os volumes mem0_storage/mem0_pgdata.
    volumes:
      - ${LOCAL_BACKUP_DIR:-./backups}:/mnt/backups
      - spec_attachments:/mnt/spec-attachments
      - planka_attachments:/mnt/planka-attachments
    # --no-access-log: o access log do uvicorn imprime a URL completa com query
    # string, o que vazaria o ?token= dos agentes (ADR-003). A observabilidade
    # de requisições vem do logging estruturado (request_id/auth_method) e das
    # trilhas write/read_audit_logs — que nunca contêm o token.
    # The legacy SSE transport keeps its session registry in the Python
    # process. Multiple Uvicorn workers therefore make /mcp/messages lose the
    # session created by /mcp/*/sse/* and clients retry until their timeout.
    # Streamable HTTP is stateless, but the shared API process also serves SSE
    # for existing agent installations, so keep this service single-process.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request; response = urllib.request.urlopen(
          'http://127.0.0.1:8765/health', timeout=2); raise SystemExit(
          0 if response.status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    command: >
      sh -c "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8765 --workers 1 --no-access-log"

  openmemory-write-worker:
    <<: *api-common
    container_name: openmemory_write_worker
    environment:
      <<: *api-env
      RUN_EMBEDDED_WORKER: "false"
      # Keep <= llama.cpp --parallel (currently 1). Raising without LLM parallel
      # slots does not speed drain; batch_size is auto-raised to >= concurrency.
      WRITE_WORKER_MAX_CONCURRENCY: ${WRITE_WORKER_MAX_CONCURRENCY:-1}
      WRITE_WORKER_BATCH_SIZE: ${WRITE_WORKER_BATCH_SIZE:-1}
      WRITE_WORKER_JOB_TIMEOUT_SEC: ${WRITE_WORKER_JOB_TIMEOUT_SEC:-1800}
      WRITE_WORKER_HEARTBEAT_INTERVAL_SEC: ${WRITE_WORKER_HEARTBEAT_INTERVAL_SEC:-15}
      WRITE_WORKER_HEARTBEAT_STALE_SEC: ${WRITE_WORKER_HEARTBEAT_STALE_SEC:-90}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.workers

  # Governança (Fase 3 / ADR-005): consome a fila de governança e roda o
  # processamento "inteligente" off-peak — dedup, consolidação (dream), ttl,
  # quota e cold tier — com scheduler interno e parada obrigatória na janela
  # off_peak_hours_utc. Singleton (uma instância); o lock é a própria fila.
  openmemory-governance-worker:
    <<: *api-common
    container_name: openmemory_governance_worker
    environment:
      <<: *api-env
      RUN_EMBEDDED_WORKER: "false"
      GOVERNANCE_ENABLE_SCHEDULER: "true"
    depends_on:
      mem0_store:
        condition: service_started
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.workers.governance_worker

  # Backup autônomo (task_06 / ADR-002). Lê a BackupPolicy (Config) e dispara
  # BackupArchive.create() conforme a agenda; respeita enabled=False por padrão
  # (não faz backup até ser configurado na UI). Singleton; grava no diretório
  # local montado e, se mirror_s3, espelha no bucket.
  openmemory-backup-worker:
    <<: *api-common
    container_name: openmemory_backup_worker
    environment:
      <<: *api-env
      RUN_EMBEDDED_WORKER: "false"
      BACKUP_WORKER_SLEEP: ${BACKUP_WORKER_SLEEP:-300}
    volumes:
      - ${LOCAL_BACKUP_DIR:-./backups}:/mnt/backups
      - spec_attachments:/mnt/spec-attachments
      - planka_attachments:/mnt/planka-attachments
    depends_on:
      mem0_store:
        condition: service_started
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.workers.backup_worker

  # Blue-green partition migration (Fase 2 / task_06 / ADR-003). Run on demand to
  # copy the existing base into the partitioned (green) collection; isolated from
  # the write worker so the bulk copy does not compete with the write-queue SLA.
  openmemory-migration-worker:
    <<: *api-common
    container_name: openmemory_migration_worker
    profiles: ["migration"]
    restart: "no"
    environment:
      <<: *api-env
      RUN_EMBEDDED_WORKER: "false"
    depends_on:
      pgbouncer:
        condition: service_healthy
    command: python -m app.workers.migration_worker

  # UI (painel + /admin) — parte padrão do stack de produção (modo único).
  # NEXT_PUBLIC_API_URL deve ser /api-proxy (same-origin no navegador). A API
  # interna é alcançada pelo route handler api-proxy via API_INTERNAL_URL.
  openmemory-ui:
    container_name: openmemory_ui
    build:
      context: ui/
      dockerfile: Dockerfile
    image: mem0/openmemory-ui:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    # HTTPS via Traefik (ADR-009): https://${UI_HOSTNAME} → UI. O acesso direto
    # http://IP:3000 continua funcionando (porta publicada acima).
    labels:
      - traefik.enable=true
      - traefik.http.routers.openmemory-ui.rule=Host(`${UI_HOSTNAME:-memorias.sysmo.com.br}`)
      - traefik.http.routers.openmemory-ui.entrypoints=websecure
      - traefik.http.routers.openmemory-ui.tls=true
      - traefik.http.services.openmemory-ui.loadbalancer.server.port=3000
    depends_on:
      openmemory-mcp:
        condition: service_started
    environment:
      # Browser calls /api-proxy on the same host:port; Next rewrites to the API container.
      - API_INTERNAL_URL=http://openmemory-mcp:8765
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api-proxy}
      # URL direta da API para os comandos de instalação MCP (agentes conectam
      # por IP:8765, não pelo hostname da UI). Sem isto, ao acessar a UI via
      # https://memorias.sysmo.com.br os comandos sairiam com
      # https://memorias.sysmo.com.br:8765 (porta não roteada no hostname → erro).
      # O installer grava aqui o discovery URL (http://IP_DA_LAN:8765).
      - NEXT_PUBLIC_MCP_URL=${NEXT_PUBLIC_MCP_URL:-}
      - NEXT_PUBLIC_USER_ID=${OPENMEMORY_UI_USER_ID:-openmemory}
      # Login Google na UI (feature auth Google, ADR-002). Segredos de servidor
      # (não passam pelo sed de NEXT_PUBLIC_* do entrypoint): defina no .env.
      # NEXTAUTH_URL deve ser a URL da UI acessível na LAN (ex.: http://IP:3000).
      # ADMIN_TOKEN: só no container (nunca NEXT_PUBLIC_*). O /api-proxy injeta
      # X-Admin-Token em mutações /admin/* quando a UI está em modo legado sem
      # sessão Google — senão Backup/Restore/etc. falham com 401.
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # AUTH_UI_REQUIRED=0 → UI legado (sem forçar /login). Vazio = auto (Google id).
      - AUTH_UI_REQUIRED=${AUTH_UI_REQUIRED:-}
      - NEXT_PUBLIC_AUTH_UI_REQUIRED=${AUTH_UI_REQUIRED:-}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      # Proxy /registry-api → AgentRegistry (loja interna)
      - AGENT_REGISTRY_INTERNAL_URL=${AGENT_REGISTRY_INTERNAL_URL:-http://agentregistry:8080}
      # Proxy /planka → sidecar Kanban (mesmo raciocínio do registry-api acima).
      # Sem isto, o board só funcionava via Traefik na porta :8765 (profile
      # sidecars) — quebrando o embed same-origin em :3000 direto e no domínio
      # HTTPS de produção, onde só o router Host()-based da própria UI existe.
      - PLANKA_INTERNAL_URL=${PLANKA_INTERNAL_URL:-http://planka:1337}

  # Catálogo da loja interna (AgentRegistry / mem0registry). Schema PostgreSQL
  # `agentregistry` no mesmo DB openmemory. NÃO usa Qdrant / mem0_store.
  # Profile ``sidecars``: build multi-stage (Dockerfile.mem0). O ``install.py
  # --update`` faz rebuild explícito deste serviço; para subir manualmente use:
  #   COMPOSE_PROFILES=sidecars docker compose -f docker-compose.scale.yml up -d agentregistry planka
  agentregistry:
    profiles: ["sidecars"]
    container_name: openmemory_agentregistry
    build:
      context: ../integrations/agentregistry
      dockerfile: docker/Dockerfile.mem0
    image: mem0/agentregistry:local
    restart: unless-stopped
    environment:
      AGENT_REGISTRY_SERVER_ADDRESS: ":8080"
      AGENT_REGISTRY_MCP_PORT: "0"
      AGENT_REGISTRY_LOG_LEVEL: ${AGENT_REGISTRY_LOG_LEVEL:-info}
      # Postgres direto (migrações/locks); não usar PgBouncer transaction mode.
      AGENT_REGISTRY_DATABASE_URL: postgres://${POSTGRES_USER:-mem0}:${POSTGRES_PASSWORD:-mem0}@postgres:5432/${POSTGRES_DB:-openmemory}?sslmode=disable
      DATABASE_URL: postgres://${POSTGRES_USER:-mem0}:${POSTGRES_PASSWORD:-mem0}@postgres:5432/${POSTGRES_DB:-openmemory}?sslmode=disable
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-${NEXTAUTH_SECRET:-}}
      AUTH_ADMIN_EMAILS: ${AUTH_ADMIN_EMAILS:-}
      MEM0_AUTH_ALLOW_LEGACY: ${MEM0_AUTH_ALLOW_LEGACY:-1}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v0/ping >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    expose:
      - "8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.agentregistry.rule=PathPrefix(`/registry-api`)
      - traefik.http.routers.agentregistry.entrypoints=web
      - traefik.http.routers.agentregistry.priority=90
      - traefik.http.middlewares.agentregistry-strip.stripprefix.prefixes=/registry-api
      - traefik.http.routers.agentregistry.middlewares=agentregistry-strip
      - traefik.http.services.agentregistry.loadbalancer.server.port=8080

  # Kanban PLANKA sidecar (vendor em integrations/planka/). Schema PostgreSQL
  # `planka` no mesmo DB openmemory. Anexos em volume dedicado — NÃO usa Qdrant / mem0_store.
  # Profile ``sidecars``: mesmo motivo do agentregistry — não bloquear install --update.
  planka:
    profiles: ["sidecars"]
    container_name: openmemory_planka
    build:
      context: ../integrations/planka
      dockerfile: docker/Dockerfile.mem0.runtime
    image: mem0/planka:local
    restart: unless-stopped
    environment:
      # BASE_URL do app PLANKA precisa ser URL absoluta (new URL() no custom.js).
      # O embed da UI usa PLANKA_PUBLIC_URL (caminho relative /planka) via API.
      BASE_URL: ${PLANKA_BASE_URL:-${NEXTAUTH_URL:-https://memorias.sysmo.com.br}/planka}
      # Postgres direto (migrações Knex); schema isolado via MEM0_PG_SCHEMA + search_path.
      DATABASE_URL: postgres://${POSTGRES_USER:-mem0}:${POSTGRES_PASSWORD:-mem0}@postgres:5432/${POSTGRES_DB:-openmemory}?sslmode=disable
      MEM0_PG_SCHEMA: planka
      SECRET_KEY: ${PLANKA_SECRET_KEY:-${NEXTAUTH_SECRET:-${AUTH_JWT_SECRET:-}}}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-${NEXTAUTH_SECRET:-}}
      MEM0_AUTH_ALLOW_LEGACY: ${MEM0_AUTH_ALLOW_LEGACY:-1}
      INTERNAL_ACCESS_TOKEN: ${PLANKA_INTERNAL_ACCESS_TOKEN:-${INTERNAL_ACCESS_TOKEN:-}}
      OPENMEMORY_INTERNAL_URL: ${OPENMEMORY_INTERNAL_URL:-http://openmemory-mcp:8765}
      OPENMEMORY_BRIDGE_TOKEN: ${PLANKA_INTERNAL_ACCESS_TOKEN:-${INTERNAL_ACCESS_TOKEN:-}}
      # Socket.IO is reached directly through Traefik from the UI origin.
      # Allow the browser origins used by direct LAN and HTTPS access.
      SOCKET_ALLOWED_ORIGINS: ${SOCKET_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://192.168.2.184:3000,https://${UI_HOSTNAME:-memorias.sysmo.com.br}}
      TRUST_PROXY: "true"
      DEFAULT_ADMIN_EMAIL: ${PLANKA_DEFAULT_ADMIN_EMAIL:-admin@mem0.local}
      DEFAULT_ADMIN_PASSWORD: ${PLANKA_DEFAULT_ADMIN_PASSWORD:-${PLANKA_INTERNAL_ACCESS_TOKEN:-mem0-planka-admin}}
      DEFAULT_ADMIN_NAME: ${PLANKA_DEFAULT_ADMIN_NAME:-Mem0 Admin}
      DEFAULT_ADMIN_USERNAME: ${PLANKA_DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_LANGUAGE: ${PLANKA_DEFAULT_LANGUAGE:-pt-BR}
    volumes:
      - planka_attachments:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1337/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    expose:
      - "1337"
    labels:
      - traefik.enable=true
      # Browser usa BASE_URL=/planka; Traefik STRIP no backend (docs oficiais PLANKA).
      - traefik.http.routers.planka.rule=PathPrefix(`/planka`)
      - traefik.http.routers.planka.entrypoints=web
      - traefik.http.routers.planka.priority=90
      - traefik.http.middlewares.planka-public-strip.stripprefix.prefixes=/planka
      - traefik.http.routers.planka.middlewares=planka-public-strip
      - traefik.http.services.planka.loadbalancer.server.port=1337
      # Compat: /planka-api ainda aponta ao sidecar (ops/smoke antigos).
      - traefik.http.routers.planka-api-legacy.rule=PathPrefix(`/planka-api`)
      - traefik.http.routers.planka-api-legacy.entrypoints=web
      - traefik.http.routers.planka-api-legacy.priority=89
      - traefik.http.middlewares.planka-api-strip.stripprefix.prefixes=/planka-api
      - traefik.http.routers.planka-api-legacy.middlewares=planka-api-strip
      - traefik.http.routers.planka-api-legacy.service=planka

volumes:
  mem0_storage:
  spec_attachments:
  planka_attachments:
